<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My todo app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script type="module" src="controller.js" defer></script>
  </head>
  <body class="bg-light">

    <div class="modal fade" tabindex="-1" aria-hidden="true" id="editModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Todo Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- edit todo item form cloned here -->
          </div>
        </div>
      </div>
    </div>

    <div class="container-lg">
      <h1 class="text-center my-4">My Todo App</h1>
      
      <div class="bg-white rounded border shadow-sm p-3">
        <form id="todoForm">
          <div class="mb-3">
            <label for="titleInput" class="form-label">Title</label>
            <input type="text" name="title" class="form-control" id="titleInput" required>
          </div>
          <div class="mb-3">
            <label for="descriptionInput" class="form-label">Description</label>
            <textarea name="description" class="form-control" id="descriptionInput" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-sm mb-3">
              <label for="dateInput" class="form-label">Due Date</label>
              <input type="datetime-local" name="dueDate" id="dateInput" class="form-control" required>
            </div>
            <div class="col-sm mb-3">
              <label for="assignIput" class="form-label">Assign to Person (Optional)</label>
              <select id="assignIput" class="form-select" name="assignee" aria-label="Default select example">
                <option selected value="0">-- Select Person (Optional) --</option>
                <option value="Mattias Hellman">Mattias Hellman</option>
                <option value="Sindhuja Parthasarathy">Sindhuja Parthasarathy</option>
                <option value="Iffat Zabin">Iffat Zabin</option>
                <option value="Zackaria Azzoug">Zackaria Azzoug</option>
                <option value="Alexander Haitin">Alexander Haitin</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="attachmentInput" class="form-label">Attachments</label>
            <div class="input-group">
              <input id="attachmentInput" class="form-control attachments" type="file" multiple name="attachments" />
              <button class="btn btn-outline-secondary" type="button" id="clearAttachments">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>
          <div class="border rounded p-3 mb-3" style="min-height: 60px;">
            <!-- Attachment previews will go here later -->
             <ul class="list-group attachmentList"></ul>
          </div>
          <button type="submit" class="btn btn-primary d-flex align-items-center gap-1 ms-auto">
            <i class="bi bi-plus-lg"></i>
            Add Todo
          </button>
        </form>
      </div>

      <div class="card border shadow-sm mt-4 mb-5 d-none" id="todoHolder">
        <div class="card-header bg-white d-flex justify-content-between align-items-center p-3"><!-- no padding in sketch -->
          <h2 class="h5 mb-0">Todos</h2>
          <div class="btn-group" aria-label="Filter">
            <button type="button" class="btn btn-sm btn-outline-secondary btnFilter">
              <i class="bi bi-funnel"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary btnSort">
              <i class="bi bi-sort-down"></i>
            </button>
          </div>
        </div>

        <ul id="todoList" class="list-group m-3">
          <template id="todoItemTemplate">
            <li id="todoItem-0" class="list-group-item todoListItem">
              <div class="container-lg px-0">
                <div class="row">
                  <div class="col-auto order-1 me-auto">
                    <p class="fw-semibold m-0 todoTitle">Example Todo 1</p> 
                    <p class="my-1 small text-secondary todoDescription">Description goes here</p>
                  </div>
                  <div class="col-sm-auto order-3 order-sm-2 mb-1 pe-0 small text-secondary">
                    Created: <span class="text-nowrap todoCreatedDate">2025-07-01</span>
                  </div>
                  <div class="col-auto order-2 mb-1 order-sm-3 text-end">
                    <div class="btn-group" aria-label="Edit">
                      <button type="button" class="btn btn-sm btn-outline-success btnAccept">
                        <i class="bi bi-check-lg"></i>
                      </button>
                      <button type="button" class="btn btn-sm btn-outline-primary btnEdit" data-bs-toggle="modal" data-bs-target="#editModal">
                        <i class="bi bi-pencil"></i>
                      </button>
                      </button>
                      <button type="button" class="btn btn-sm btn-outline-danger btnDelete">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                  <div class="col-12 order-4 small text-secondary">
                    <div class="row gx-2">
                      <div class="col-sm-auto">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-calendar-event me-1"></i>
                          Due:<span class="ms-1 text-nowrap todoDueDate">2025-07-10</span>
                        </div>
                      </div>
                      <div class="col-sm-auto mt-2 mt-sm-0 d-flex align-items-center gap-2">
                        <span class="badge text-bg-info text-white py-1 d-flex align-items-center todoAssigneeBadge">
                          <i class="bi bi-person me-1"></i>
                          <span class="todoAssignee">John Doe</span>
                        </span>
                        <span class="badge text-bg-secondary text-white py-1 d-flex align-items-center todoAttachmentsBadge">
                          <i class="bi bi-paperclip me-1"></i>
                          <span class="todoAttachements">2 attachments</span>
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
           </li>
          </template>
        </ul>
      </div>
    </div>
  </body>
</html>
